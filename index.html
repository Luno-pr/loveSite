<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С Днём Рождения!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Слой ночи: лежит на белой основе и ждёт клика по кнопке -->
    <div class="nightLayer" id="night"></div>

    <!-- Холст, на котором JavaScript рисует звёздное небо -->
    <canvas id="sky"></canvas>

    <!-- ПЕРВЫЙ ЭКРАН: карточка-приглашение и большое поздравление.
         Оба блока лежат в одной ячейке сетки, поэтому накладываются друг на друга -->
    <section class="screen">
        <div class="welcomeBox" id="welcome">
            <p class="text" id="text">С днём рождения!</p>
            <p class="hint" id="hint">Нажми на кнопку чтобы увидеть<br>мой сюрприз</p>
            <button id="startButton" type="button">Нажми</button>
        </div>

        <div class="finalMessage" id="finalMessage">
            <p>Листай вниз</p>
        </div>
    </section>

    <!-- ВТОРАЯ СЕКЦИЯ: сюда добавляй всё, что должно быть ниже.
         Фон со звёздами закреплён в окне и остаётся на месте при прокрутке -->
    <section class="screen">
        <div class="defaultBox reveal">
            <p class="selebrate">Я тебя поздравляю, моя хорошая, с днём рождения!</p>
        </div>
    </section>

    <section class="screen">
        <div class="defaultBox reveal">
            <p class="selebrate">Желаю тебе счастья, здоровья,<br>любви и спокойствия<br></p>
        </div>
    </section>

    <section class="screen">
        <div class="defaultBox reveal">
            <p class="selebrate">Желаю тебе чтобы все твои мечты сбывались,<br>а цели достигались</p>
        </div>
    </section>

    <section class="screen">
        <div class="defaultBox reveal">
            <p class="selebrate">И конечно же,<br> я тебя очень сильно люблю моя хорошая!</p>
        </div>
    </section>

    <section class="screen">
        <div class="reveal">
            <button type="button" class="bigButt" id="bigButton">
                <span class="buttText">Большое сообщение</span>
            </button>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
